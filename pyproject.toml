[project]
name = "argentum-press"
version = "0.1.0"
description = "Compile Scryfall card data into argentum-engine Kotlin DSL sources."
readme = "README.md"
authors = [
    { name = "Kristian Nymann Jakobsen", email = "kristian@nymann.dev" }
]
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.27",
    "mtgcompiler",
]

[project.scripts]
argentum-press = "argentum_press.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-httpx>=0.30",
    "ruff>=0.6",
    "mypy>=1.10",
]

[build-system]
requires = ["uv_build>=0.11.13,<0.12.0"]
build-backend = "uv_build"

[tool.uv.sources]
mtgcompiler = { path = "../mtgcompiler", editable = true }

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_return_any = true
warn_unused_ignores = true
