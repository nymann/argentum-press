[project]
name = "argentum-press"
version = "0.1.0"
description = "Compile Scryfall card data into argentum-engine Kotlin DSL sources."
readme = "README.md"
authors = [
    { name = "Kristian Nymann Jakobsen", email = "kristian@nymann.dev" }
]
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.27",
    "lark==1.2.2",
    # Syntax highlighting for Read tool_results in scripts/fix_parser_gaps.py.
    # Optional in spirit: the orchestrator degrades gracefully if pygments
    # is missing or can't find a lexer. Cheap enough to bundle.
    "pygments>=2.18",
    # libcst: AST-precise edits for the lower-gap playbook (insert
    # @register handlers, splice isinstance branches into helpers).
    "libcst>=1.4",
    # jsonschema: validate the JSON each playbook LLM step is constrained to
    # emit. Tool-use enforces shape on the wire; we re-check for safety
    # before applying.
    "jsonschema>=4.23",
    # anthropic: Claude SDK for the playbook's tool_use-constrained calls.
    "anthropic>=0.40",
]

[project.scripts]
argentum-press = "argentum_press.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-httpx>=0.30",
    "pytest-xdist>=3.6",
    "ruff>=0.6",
    "pyright>=1.1.380",
]

[build-system]
requires = ["uv_build>=0.11.13,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "strict"
